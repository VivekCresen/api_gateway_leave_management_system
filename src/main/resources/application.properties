spring.application.name=api-gateway
server.port=8080

spring.config.import=optional:configserver:http://localhost:8888

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.mvc.routes[0].id=user-service
spring.cloud.gateway.mvc.routes[0].uri=lb://user-service
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.mvc.routes[1].id=leave-service
spring.cloud.gateway.mvc.routes[1].uri=lb://leave-service
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/leaves/**

management.endpoints.web.exposure.include=health,info
